services:
  # ============================================================================
  # EVOLUTION API v2 (WhatsApp Engine Estável para JOGIMIL)
  # Rede interna isolada (sem conflito de portas com outros projetos Docker)
  # ============================================================================
  jogimil-evolution-postgres:
    image: postgres:15-alpine
    container_name: jogimil-evolution-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=evolution
      - POSTGRES_PASSWORD=evolution_jogimil_2026
      - POSTGRES_DB=evolution
    volumes:
      - jogimil_evo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - jogimil-evo-net

  jogimil-evolution-redis:
    image: redis:7-alpine
    container_name: jogimil-evolution-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - jogimil_evo_redis:/data
    networks:
      - jogimil-evo-net

  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: jogimil-evolution-api
    restart: unless-stopped
    depends_on:
      jogimil-evolution-postgres:
        condition: service_healthy
      jogimil-evolution-redis:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      - SERVER_TYPE=http
      - SERVER_PORT=8080
      - SERVER_URL=http://localhost:8080
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=jogimil_secret_key_2026
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true
      - LOG_LEVEL=ERROR,WARN
      - DEL_INSTANCE=false
      # Persistência estável em PostgreSQL interno
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution:evolution_jogimil_2026@jogimil-evolution-postgres:5432/evolution?schema=public
      - DATABASE_CONNECTION_CLIENT_NAME=jogimil_evolution
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - DATABASE_SAVE_MESSAGE_UPDATE=true
      - DATABASE_SAVE_DATA_CONTACTS=true
      - DATABASE_SAVE_DATA_CHATS=true
      # Cache Redis interno (sessões estáveis)
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://jogimil-evolution-redis:6379/1
      - CACHE_REDIS_PREFIX_KEY=jogimil_evo
      - CACHE_LOCAL_ENABLED=false
      # Boas práticas de conexão & QR Code
      - QRCODE_LIMIT=30
      - CONFIG_SESSION_PHONE_CLIENT=JOGIMIL Admin
      - CONFIG_SESSION_PHONE_NAME=Chrome
      # Webhook apontado para o servidor JOGIMIL (porta exclusiva 3101)
      - WEBHOOK_GLOBAL_ENABLED=true
      - WEBHOOK_GLOBAL_URL=http://host.docker.internal:3101/api/v1/webhooks/evolution
      - WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS=false
      - WEBHOOK_EVENTS_QRCODE_UPDATED=true
      - WEBHOOK_EVENTS_MESSAGES_UPSERT=true
      - WEBHOOK_EVENTS_MESSAGES_UPDATE=true
      - WEBHOOK_EVENTS_CONNECTION_UPDATE=true
    volumes:
      - jogimil_evo_instances:/evolution/instances
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - jogimil-evo-net

volumes:
  jogimil_evo_pgdata:
  jogimil_evo_redis:
  jogimil_evo_instances:

networks:
  jogimil-evo-net:
    driver: bridge
