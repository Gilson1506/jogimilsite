version: '3.8'

services:
  # ============================================================================
  # EVOLUTION API (WhatsApp Engine para Omnicanal JOGIMIL)
  # Documentação: https://doc.evolution-api.com/
  # ============================================================================
  evolution-api:
    image: atendai/evolution-api:v2.1.2
    container_name: jogimil-evolution-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SERVER_TYPE=http
      - SERVER_PORT=8080
      - SERVER_URL=http://localhost:8080
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=jogimil_secret_key_2026
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true
      - LOG_LEVEL=ERROR,WARN,INFO
      - DEL_INSTANCE=false
      - DATABASE_ENABLED=false
      - DATABASE_PROVIDER=local
      - CACHE_REDIS_ENABLED=false
      - QRCODE_LIMIT=30
      - WEBHOOK_GLOBAL_ENABLED=true
      - WEBHOOK_GLOBAL_URL=http://host.docker.internal:3001/api/v1/admin/whatsapp/webhook
    volumes:
      - ./data/evolution_instances:/evolution/instances
      - ./data/evolution_store:/evolution/store
    extra_hosts:
      - "host.docker.internal:host-gateway"
