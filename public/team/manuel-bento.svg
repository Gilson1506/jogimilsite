<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="400" height="480">
  <defs>
    <linearGradient id="bgMB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#001844"/>
      <stop offset="100%" stop-color="#0066FF"/>
    </linearGradient>
    <linearGradient id="glowMB" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#0066FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0066FF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="480" fill="url(#bgMB)"/>
  <circle cx="200" cy="180" r="140" fill="url(#glowMB)" opacity="0.3"/>
  <g fill="none" stroke="#0066FF" stroke-width="1.5" opacity="0.25">
    <circle cx="200" cy="170" r="110"/>
    <circle cx="200" cy="170" r="75"/>
    <line x1="50" y1="170" x2="350" y2="170"/>
    <line x1="200" y1="20" x2="200" y2="320"/>
  </g>
  <!-- Silhouette head -->
  <circle cx="200" cy="155" r="54" fill="#ffffff" opacity="0.95"/>
  <!-- Silhouette torso -->
  <path d="M120 310 C120 235, 150 225, 200 225 C250 225, 280 235, 280 310 Z" fill="#ffffff" opacity="0.9"/>
  <!-- Executive Badge -->
  <rect x="130" y="340" width="140" height="34" rx="2" fill="#000000" stroke="#0066FF" stroke-width="2"/>
  <text x="200" y="362" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">JOGIMIL TECH</text>
  <text x="200" y="415" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Manuel Bento</text>
  <text x="200" y="440" fill="#0066FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">DIRECTOR GERAL</text>
</svg>
