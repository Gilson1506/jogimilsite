      <stop offset="0%" stopColor="#0B132B" />
      <stop offset="50%" stopColor="#1B2A4A" />
      <stop offset="100%" stopColor="#0B1220" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#06B6D4" />
      <stop offset="100%" stopColor="#0284C7" />
    </linearGradient>
  </defs>

  <rect width="800" height="480" rx="16" fill="url(#bgGrad3)" />
  <circle cx="680" cy="120" r="130" fill="#06B6D4" opacity="0.18" filter="blur(60px)" />
  <circle cx="140" cy="360" r="110" fill="#0284C7" opacity="0.12" filter="blur(50px)" />

  <!-- Janela Principal do StockERP -->
  <g>
    <rect x="40" y="35" width="720" height="410" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
    
    <!-- Barra Superior -->
    <path d="M40 47C40 40.3726 45.3726 35 52 35H748C754.627 35 760 40.3726 760 47V75H40V47Z" fill="#1E293B" />
    <circle cx="65" cy="55" r="5" fill="#EF4444" />
    <circle cx="82" cy="55" r="5" fill="#F59E0B" />
    <circle cx="99" cy="55" r="5" fill="#10B981" />
