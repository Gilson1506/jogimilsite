    <rect x="550" y="95" width="190" height="330" rx="10" fill="#111827" stroke="#1E293B" />
    <text x="568" y="125" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Relatório Logístico</text>

