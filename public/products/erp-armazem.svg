    <text x="580" y="195" fill="#22D3EE" font-family="system-ui, sans-serif" font-size="16" font-weight="800">185.4M Kz</text>

    <rect x="568" y="220" width="154" height="65" rx="8" fill="#1E293B" />
    <text x="580" y="240" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">Transferências Hoje</text>
    <text x="580" y="270" fill="#34D399" font-family="system-ui, sans-serif" font-size="18" font-weight="800">14 Cargas</text>

    <rect x="568" y="295" width="154" height="65" rx="8" fill="#1E293B" />
    <text x="580" y="315" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">Alertas de Reposição</text>
    <text x="580" y="345" fill="#F59E0B" font-family="system-ui, sans-serif" font-size="18" font-weight="800">3 Artigos</text>
